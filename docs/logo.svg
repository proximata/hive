<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Hive: a bee on a honeycomb cell">
  <defs>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c4ddb"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd75e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="abdomen">
      <ellipse cx="100" cy="122" rx="31" ry="38"/>
    </clipPath>
  </defs>

  <!-- Honeycomb cell: flat-top hexagon, the hive -->
  <polygon points="100,4 183,52 183,148 100,196 17,148 17,52" fill="url(#cell)"/>
  <polygon points="100,20 169,60 169,140 100,180 31,140 31,60" fill="none"
           stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <!-- Wings, each rotated about its own root so it stays hinged to the body -->
  <g fill="#ffffff" fill-opacity="0.5">
    <ellipse cx="60" cy="92" rx="26" ry="13" transform="rotate(-26 78 100)"/>
    <ellipse cx="140" cy="92" rx="26" ry="13" transform="rotate(26 122 100)"/>
  </g>

  <!-- Abdomen with clipped stripes, so no corner ever pokes out of the body -->
  <ellipse cx="100" cy="122" rx="31" ry="38" fill="url(#honey)"/>
  <g clip-path="url(#abdomen)" fill="#231400">
    <rect x="60" y="98" width="80" height="13" rx="6"/>
    <rect x="60" y="124" width="80" height="13" rx="6"/>
    <rect x="60" y="150" width="80" height="13" rx="6"/>
  </g>

  <!-- Head -->
  <circle cx="100" cy="72" r="24" fill="#231400"/>
  <circle cx="91" cy="68" r="5.5" fill="#ffffff"/>
  <circle cx="109" cy="68" r="5.5" fill="#ffffff"/>

  <!-- Antennae -->
  <g stroke="#231400" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M88 52 Q80 38 68 34"/>
    <path d="M112 52 Q120 38 132 34"/>
  </g>
  <circle cx="66" cy="33" r="4.5" fill="#ffd75e"/>
  <circle cx="134" cy="33" r="4.5" fill="#ffd75e"/>
</svg>
