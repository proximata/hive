name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What's the use case?
      placeholder: "As a relay operator, I want to... so that..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Describe the feature.
      placeholder: "Add a new kind X for Y that does Z..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
      placeholder: "Could also do X, but Y is better because..."
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Relay (NIP-01/29/42)
        - Store (SQLite, search, audit)
        - Auth (NIP-42, NIP-98, rate limiting)
        - CLI (hive-cli)
        - Agents (hive-agent, QVAC)
        - Workflows (hive-workflow)
        - Build/Packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low (nice to have)
        - Medium (should have)
        - High (blocking)
        - Critical (security/breaking)
    validations:
      required: true
  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking Changes
      options:
        - label: This introduces breaking changes
          required: false
        - label: Requires SPEC.md update
          required: false
        - label: Requires protocol version bump
          required: false