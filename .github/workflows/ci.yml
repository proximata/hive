name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `bash -eo pipefail` everywhere: without pipefail, `npm test | tail` reports
# tail's exit code, which is how this workflow stayed green for its whole life
# while `npm test` was exiting 127 and running no tests at all.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, bare-runtime ${{ matrix.bare-runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # Node version matrix with default bare-runtime (^1.4.0 -> latest 1.x)
          - node-version: '18'
            bare-runtime: 'latest'
          - node-version: '20'
            bare-runtime: 'latest'
          - node-version: '22'
            bare-runtime: 'latest'
          # Test a stable bare-runtime version (1.20.0 - same architecture as latest)
          - node-version: '22'
            bare-runtime: '1.20.0'
          # Test latest bare-runtime explicitly on Node 22
          - node-version: '22'
            bare-runtime: 'latest-explicit'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Override bare-runtime version for specific matrix entries
          BARE_RUNTIME_VERSION: ${{ matrix.bare-runtime }}

      - name: Adjust bare-runtime version if needed
        if: matrix.bare-runtime != 'latest'
        run: |
          if [ "${{ matrix.bare-runtime }}" = "latest-explicit" ]; then
            npm install bare-runtime@latest --save-dev
          else
            npm install bare-runtime@${{ matrix.bare-runtime }} --save-dev
          fi

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run end-to-end demo
        run: npm run demo

      - name: Run TUI demo scenes
        run: npm run demo:tui -- --demo

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` aliases `make`, which dispatches to the host target.
      # It used to be `npm run build || echo "Build script not available yet"`
      # against a script that did not exist, so the job passed while producing
      # nothing and the upload found an empty out/.
      - name: Build standalone binary
        run: npm run build

      # Guard the upload rather than trusting it: upload-artifact only warns
      # when a path is empty, so a silently broken build would still look green.
      - name: Verify the binary exists and runs
        run: |
          BINARY=out/linux-x64/hive
          test -x "$BINARY" || { echo "::error::$BINARY was not produced"; exit 1; }
          echo "built $(du -h "$BINARY" | cut -f1) binary"
          test "$("$BINARY" --version)" = "$(node -p "require('./package.json').version")"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: hive-linux-x64
          path: out/linux-x64/hive
          if-no-files-found: error
          retention-days: 7